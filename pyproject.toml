[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiered-rag-service"
version = "0.1.0"
description = "Tiered hybrid-retrieval QA service over Chinese PDF documents (FastAPI + LangChain + Chroma + BM25 + rerank)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langchain==1.4.5",
    "langchain-core==1.6.10",
    "langchain-community==0.4.2",
    "langchain-classic==1.0.8",
    "langchain-huggingface==1.2.3",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "chromadb==1.5.9",
    "sentence-transformers==6.2.0",
    "pypdf==6.21.1",
    "jieba==0.42.1",
    "rank-bm25==0.2.2",
    "redis==8.1.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==0.25.0",
    "ruff==0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tiered_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "ui", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameter metadata by calling File()/Form()/Depends() in the
# signature, which B008 would otherwise flag as an impure default value.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]
