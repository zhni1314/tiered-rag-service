name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Unit tests cover pure logic only (config, cleaning, chunking, path safety),
      # so CI never downloads models, starts Redis, or needs an API key.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest ruff pydantic python-dotenv httpx
          pip install pypdf langchain-core langchain-text-splitters

      - name: Lint
        run: ruff check src tests scripts

      - name: Unit tests
        run: pytest
